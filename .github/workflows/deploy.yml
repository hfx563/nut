name: Deploy Nut to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Nut app files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp chat.js _site/
          cp call.js _site/
          cp style.css _site/
          cp manifest.json _site/
          cp logo.png _site/
          cp logo.svg _site/
          cp logo.webp _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
